<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>좌표 평면</title><style>
:root{color-scheme:light dark;--bg:#fff;--fg:#2c2c2b;--grid:#e6e5e3;--axis:#7d7a75;--blue:#2783de;--purple:#9561c4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif}canvas{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:780px}@media(prefers-color-scheme:dark){:root{--bg:#191919;--fg:#fff;--grid:#383836;--axis:#aaa;--blue:#5e9fe8;--purple:#bf8eda}}
</style></head><body><canvas aria-label="x/y 좌표 평면. o=(0,0), c=(2,-2), t=(2,2). c에서 o로 향하는 단위 벡터=(-1/√2,+1/√2). t에서 o로 향하는 단위 벡터=(-1/√2,-1/√2).">o=(0,0), c=(2,-2), t=(2,2). c → o: (-1/√2,+1/√2), t → o: (-1/√2,-1/√2).</canvas><script>
(()=>{const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');function draw(){const box=canvas.getBoundingClientRect(),w=box.width,h=box.height,dpr=window.devicePixelRatio||1;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const css=getComputedStyle(document.documentElement),col=n=>css.getPropertyValue(n).trim();ctx.fillStyle=col('--bg');ctx.fillRect(0,0,w,h);const scale=Math.min(w-16,h-100)/8.4,ox=w/2,oy=(h-88)/2;const P=(x,y)=>[ox+x*scale,oy-y*scale];function line(a,b,color,width=1,dash=[]){ctx.beginPath();ctx.setLineDash(dash);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.moveTo(...a);ctx.lineTo(...b);ctx.stroke();ctx.setLineDash([])}function arrow(a,b,color,width=2){line(a,b,color,width);const angle=Math.atan2(b[1]-a[1],b[0]-a[0]),size=9;ctx.beginPath();ctx.moveTo(...b);ctx.lineTo(b[0]-size*Math.cos(angle-.43),b[1]-size*Math.sin(angle-.43));ctx.lineTo(b[0]-size*Math.cos(angle+.43),b[1]-size*Math.sin(angle+.43));ctx.closePath();ctx.fillStyle=color;ctx.fill()}function text(s,x,y,align='left',color=col('--fg'),size=14){ctx.font=`${size}px system-ui,sans-serif`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillStyle=color;ctx.fillText(s,x,y)}for(let i=-3;i<=3;i++){if(i){line(P(i,-3.5),P(i,3.5),col('--grid'));line(P(-3.5,i),P(3.5,i),col('--grid'));text(String(i),P(i,0)[0],oy+19,'center');text(String(i),ox-14,P(0,i)[1],'right')}}arrow(P(-3.6,0),P(3.6,0),col('--axis'),1.5);arrow(P(0,-3.6),P(0,3.6),col('--axis'),1.5);text('x',P(3.6,0)[0],oy-18,'center',col('--fg'),16);text('y',ox+18,P(0,3.6)[1],'left',col('--fg'),16);const q=1/Math.sqrt(2);for(const item of [{p:[2,-2],name:'c',v:[-q,q],color:col('--blue')},{p:[2,2],name:'t',v:[-q,-q],color:col('--purple')}]){const a=P(...item.p),b=P(item.p[0]+item.v[0],item.p[1]+item.v[1]);line(a,P(0,0),item.color,1,[5,5]);arrow(a,b,item.color,3);ctx.beginPath();ctx.arc(...a,5,0,Math.PI*2);ctx.fillStyle=item.color;ctx.fill();text(`${item.name} (2, ${item.p[1]})`,a[0]+12,a[1]);}ctx.beginPath();ctx.arc(ox,oy,5,0,Math.PI*2);ctx.fillStyle=col('--fg');ctx.fill();text('o (0, 0)',ox-12,oy-18,'right');const narrow=w<500,font=narrow?14:16,x=20;const labels=[['c → o   (−1/√2, +1/√2)',col('--blue')],['t → o   (−1/√2, −1/√2)',col('--purple')]];labels.forEach((l,i)=>{const y=h-52+i*28;arrow([x,y],[x+26,y],l[1],3);text(l[0],x+38,y,'left',col('--fg'),font)});}new ResizeObserver(draw).observe(canvas);matchMedia('(prefers-color-scheme:dark)').addEventListener('change',draw);draw();})();
</script></body></html>
